  root.querySelectorAll('.m').forEach(function(el){
    if (el.dataset.done) return;
    try { katex.render(el.textContent, el, { displayMode: el.classList.contains('d'), throwOnError:false, strict:false }); el.dataset.done = '1'; } catch(e) {}
  });
  fit(root);
}
function fit(root){
  root.querySelectorAll('.m.d').forEach(function(el){
    var k = el.querySelector('.katex'); if (!k || !el.clientWidth) return;
    k.style.fontSize = '';
    var over = el.scrollWidth / el.clientWidth;
    if (over > 1.01) k.style.fontSize = Math.max(0.78, 0.99 / over) + 'em';
  });
}
function tpl(id){ var t = document.getElementById(id); return t ? t.innerHTML : ''; }
function row(l, opts){
  opts = opts || {};
  return '<button class="row" data-go="' + (opts.hw ? '#hw-' : '#lesson-') + l.id + '">' +
    '<span class="d">' + esc(l.wd) + ' ' + esc(l.day) + '</span>' +
    '<span class="t">' + (opts.subLabel ? '<span class="s">' + esc(SUBS[l.sub].short) + '</span>' : '') + esc(l.title) +
    (opts.hw ? '<span class="k">' + l.hwCount + (l.hwCount === 1 ? ' question' : ' questions') + '</span>' : (l.hw ? '<span class="k">Homework</span>' : '')) + '</span>' + CHEV + '</button>';
}

/* ---------- state + routing ---------- */
var tab = 'notes', filter = 'all', expanded = {}, openSec = {}, FRESH = true;
function parse(h){
  h = (h || '').replace(/^#/, '');
  var m;
  if (m = h.match(/^lesson-([a-z0-9-]+)$/)) return { v:'lesson', id:m[1], part:'notes' };
  if (m = h.match(/^hw-([a-z0-9-]+)$/)) return { v:'lesson', id:m[1], part:'hw' };
  if (m = h.match(/^sheet-([a-z]+)$/)) return { v:'sheet', sub:m[1] };
  if (['notes','homework','cheats','prefs'].indexOf(h) >= 0) return { v:h };
  return { v:'notes' };
}
function go(hash){ if (location.hash === hash) render(); else location.hash = hash; }
var lastKey = '';
function render(){
  var r = parse(location.hash);
  if (r.v === 'lesson' && !LES[r.id]) r = { v:'notes' };
  if (r.v === 'notes' || r.v === 'homework' || r.v === 'cheats' || r.v === 'prefs') tab = r.v;
  if (r.v === 'sheet') tab = 'cheats';
  if (r.v === 'lesson' && r.part === 'hw' && tab !== 'notes') tab = 'homework';
  var key = r.v + ':' + (r.id || r.sub || '');
  var fresh = key !== lastKey; lastKey = key; FRESH = fresh;
  var html = r.v === 'lesson' ? lessonView(r) : r.v === 'homework' ? homeworkView() : r.v === 'cheats' ? cheatsView() : r.v === 'sheet' ? sheetView(r.sub) : r.v === 'prefs' ? settingsView() : notesView();
  $screen.innerHTML = html;
  $screen.classList.remove('enter');
  if (fresh && motionOn()) { void $screen.offsetWidth; $screen.classList.add('enter'); }
  if (fresh) window.scrollTo(0, 0);
  after(r);
  dock();
}

/* ---------- Notes tab ---------- */
function notesView(){
  var h = '<div><h1 class="big">Notes</h1><p class="sub">Semester 1 · notes up to ' + esc(D.upto) + '</p></div>';
  h += '<div class="seg" role="group" aria-label="Show subject">' + [['all','All']].concat(D.subjects.map(function(s){ return [s.id, s.short]; })).map(function(x){
    return '<button data-filter="' + x[0] + '" aria-pressed="' + (filter === x[0]) + '">' + esc(x[1]) + '</button>'; }).join('') + '</div>';
  if (filter === 'all') {
    h += '<section class="card latest" aria-label="Latest lessons"><h2 class="label" style="margin-top:0">Latest</h2><div class="list">' +
      D.subjects.map(function(s){ var l = byDate.filter(function(x){ return x.sub === s.id; })[0]; return l ? row(l, { subLabel:true }) : ''; }).join('') + '</div></section>';
    D.subjects.forEach(function(s){
      var ls = byDate.filter(function(x){ return x.sub === s.id; });
      var show = expanded[s.id] ? ls : ls.slice(0, 4);
      h += '<section><h2 class="label">' + esc(s.name) + '</h2><div class="list">' + show.map(function(l){ return row(l); }).join('') + '</div>' +
        (ls.length > show.length ? '<button class="more" data-expand="' + s.id + '">Show all ' + ls.length + ' lessons</button>' : '') + '</section>';
    });
  } else {
    var s = SUBS[filter], ls = byDate.filter(function(x){ return x.sub === filter; });
    h += '<section><h2 class="label" style="margin-top:0">' + esc(s.name) + '</h2><p class="sub">' + esc(s.info) + '</p>' + (s.plan ? '<p class="sub" style="margin-top:.3rem">' + esc(s.plan) + '</p>' : '') + '</section>';
    h += '<div class="list">' + ls.map(function(l){ return row(l); }).join('') + '</div>';
  }
  return h;
}

/* ---------- a lesson ---------- */
function lessonView(r){
  var l = LES[r.id], s = SUBS[l.sub];
  var part = (r.part === 'hw' && l.hw) ? 'hw' : 'notes';
  var backTo = tab === 'homework' ? 'homework' : 'notes';
  var h = '<button class="back" data-go="#' + backTo + '">' + BACK + (backTo === 'homework' ? 'Homework' : 'Notes') + '</button>';
  h += '<div style="display:flex;flex-direction:column;gap:.25rem"><span class="when">' + esc(s.name) + ' · ' + esc(l.wd) + ' ' + esc(l.day) + '</span>' +
    '<h1 class="big" style="font-size:1.85rem"><span class="hl' + (FRESH ? ' swipe' : '') + '">' + esc(l.title) + '</span></h1>' + (l.lect ? '<p class="lect">' + l.lect + '</p>' : '') + '</div>';
  if (l.hw) h += '<div class="seg" role="group" aria-label="Lesson part"><button data-part="notes" aria-pressed="' + (part === 'notes') + '">Notes</button><button data-part="hw" aria-pressed="' + (part === 'hw') + '">Homework</button></div>';
  if (part === 'notes') {
    h += '<nav class="toc" aria-label="In this lesson"><span class="small">In this lesson</span><div class="links" id="toc"></div></nav>';
    h += '<div class="notes" id="notes">' + tpl('notes-' + l.id) + '</div>';
  } else {
    h += '<div class="hwhead"><span class="small">Homework · given <b>' + esc(l.wd) + ' ' + esc(l.day) + '</b></span><button class="showall" data-showall="1">Show all working</button></div>';
    h += '<div id="hw">' + tpl('hw-' + l.id) + '</div>';
  }
  return h;
}
function setupLesson(){
  var notes = document.getElementById('notes');
  if (notes) {
    var toc = document.getElementById('toc'), hs = notes.querySelectorAll('h4');
    toc.innerHTML = Array.prototype.map.call(hs, function(el, i){ el.id = 't' + (i + 1);
      return '<button data-jump="t' + (i + 1) + '"><span>' + (i + 1) + '</span>' + esc(el.textContent.replace(/\s*\(.*?\)\s*$/, '')) + '</button>'; }).join('');
    if (!hs.length) toc.parentNode.remove();
    tex(notes);
  }
  var hw = document.getElementById('hw');
  if (hw) {
    hw.querySelectorAll('.w').forEach(function(w){
      w.hidden = true;
      var b = document.createElement('button');
      b.className = 'show-w'; b.type = 'button'; b.textContent = 'Show working'; b.setAttribute('aria-expanded', 'false');
      w.parentNode.insertBefore(b, w);
    });
    tex(hw);
  }
}
function setWorking(btn, open, animate){
  var w = btn.nextElementSibling;
  btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  btn.textContent = open ? 'Hide working' : 'Show working';
  if (!open) { w.hidden = true; w.classList.remove('writing'); return 0; }
  w.hidden = false; fit(w);
  if (!(animate && motionOn())) return 0;
  var kids = Array.prototype.slice.call(w.children);
  w.classList.remove('writing'); void w.offsetWidth; w.classList.add('writing');
  kids.forEach(function(el, i){
    el.style.animationDelay = (i * 0.14) + 's';
    setTimeout(function(){ haptic(el.querySelector('.ans') || el.classList.contains('ans') ? 'answer' : 'line'); }, i * 140);
  });
  return kids.length;
}
function updateShowAll(){
  var b = document.querySelector('[data-showall]'); if (!b) return;
  var all = document.querySelectorAll('.show-w'), open = document.querySelectorAll('.show-w[aria-expanded="true"]');
  b.textContent = (all.length && open.length === all.length) ? 'Hide all working' : 'Show all working';
}

/* ---------- Homework tab ---------- */
function homeworkView(){
  var h = '<div><h1 class="big">Homework</h1><p class="sub">Working stays hidden until you tap Show working</p></div>';
  D.subjects.forEach(function(s){
    var ls = byDate.filter(function(x){ return x.sub === s.id && x.hw; });
    if (!ls.length) return;
    h += '<section><h2 class="label">' + esc(s.name) + '</h2><div class="list">' + ls.map(function(l){ return row(l, { hw:true }); }).join('') + '</div></section>';
  });
  return h;
}

/* ---------- Cheat sheets ---------- */
function cheatsView(){
  var h = '<div><h1 class="big">Cheat sheets</h1><p class="sub">Every formula so far, one sheet per subject</p></div>';
  h += D.sheets.map(function(sh){
    return '<button class="sheetcard" data-go="#sheet-' + sh.sub + '"><span class="n">' + esc(SUBS[sh.sub].name) + '<small>updated ' + esc(sh.updated) + '</small></span>' +
      '<span class="p">' + sh.sections.map(function(x){ return esc(x.title); }).join(' · ') + '</span></button>';
  }).join('');
  h += '<div class="key" aria-label="Colour key"><span class="kb">MUST KNOW</span><span class="kg">ANSWER</span><span class="kr">WATCH OUT</span></div>';
  return h;
}
function sheetView(sub){
  var sh = D.sheets.filter(function(x){ return x.sub === sub; })[0];
  if (!sh) return cheatsView();
  var open = openSec[sub] || {}, allOpen = sh.sections.every(function(x){ return open[x.n]; });
  var h = '<button class="back" data-go="#cheats">' + BACK + 'Cheat sheets</button><div class="sheet" style="display:flex;flex-direction:column;gap:1rem">';
  h += '<div><h1 class="big" style="font-size:1.7rem">' + esc(SUBS[sub].name) + '</h1><p class="sub">Cheat sheet · updated ' + esc(sh.updated) + '</p></div>';
  h += '<div class="hwhead"><span class="small">Tap a section to open it</span><button class="showall" style="color:var(--blue)" data-allsec="' + sub + '">' + (allOpen ? 'Close all' : 'Open all') + '</button></div>';
  h += '<div class="acc">' + sh.sections.map(function(x){
    var o = !!open[x.n];
    return '<div><button class="head" data-sec="' + sub + ':' + x.n + '" aria-expanded="' + o + '"><span>' + x.n + '</span><span>' + esc(x.title) + '</span>' +
      '<svg width="16" height="10" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 2l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".5"/></svg></button>' +
      (o ? '<div class="body">' + tpl('sheet-' + sub + '-' + x.n) + '</div>' : '') + '</div>';
  }).join('') + '</div></div>';
  return h;
}

/* ---------- Settings ---------- */
function radio(name, val, cur, title, note, style){
  return '<label class="opt"><input type="radio" name="' + name + '" value="' + val + '"' + (cur === val ? ' checked' : '') + '><span><span' + (style ? ' style="' + style + '"' : '') + '>' + title + '</span>' + (note ? '<small>' + note + '</small>' : '') + '</span></label>';
}
function check(name, on, title, note){
  return '<label class="opt"><input type="checkbox" name="' + name + '"' + (on ? ' checked' : '') + '><span><span>' + title + '</span>' + (note ? '<small>' + note + '</small>' : '') + '</span></label>';
}
function segBtns(name, cur, items){
  return '<div class="seg" role="group" aria-label="' + name + '">' + items.map(function(x){
    return '<button data-pref="' + name + '" data-val="' + x[0] + '" aria-pressed="' + (cur === x[0]) + '"' + (x[2] ? ' aria-label="' + x[2] + '" style="font-size:' + x[3] + '"' : '') + '>' + x[1] + '</button>'; }).join('') + '</div>';
}
function settingsView(){
  var h = '<h1 class="big">Settings</h1>';
  h += '<section class="set"><h2 class="label">Appearance</h2><div class="opts">' +
    radio('mode', 'light', P.mode, 'Light', 'White paper, always') + radio('mode', 'dark', P.mode, 'Dark', 'Easier at night') +
    radio('mode', 'auto', P.mode, 'Match iPhone', 'Follows your phone’s light or dark setting') + '</div></section>';
  h += '<section class="set"><h2 class="label">Reading</h2><span class="small"><b style="color:var(--ink)">Font</b></span><div class="opts">' +
    radio('font', 'hand', P.font, 'Handwritten', 'Shantell Sans · like your own notebook', "font-family:'Shantell Sans',cursive") +
    radio('font', 'clear', P.font, 'Clear print', 'Atkinson Hyperlegible · made for low vision', "font-family:'Atkinson Hyperlegible Next',sans-serif") +
    radio('font', 'easy', P.font, 'Easy-read', 'Comic Neue · simple, rounded letters', "font-family:'Comic Neue',sans-serif;font-weight:700") + '</div>' +
    '<span class="small" style="margin-top:.6rem"><b style="color:var(--ink)">Text size</b></span>' +
    segBtns('size', P.size, [['s','A','Small','.8rem'],['m','A','Medium','1rem'],['l','A','Large','1.25rem'],['xl','A','Extra large','1.5rem']]) +
    '<span class="small" style="margin-top:.6rem"><b style="color:var(--ink)">Line spacing</b></span>' +
    segBtns('space', P.space, [['normal','Normal'],['roomy','Roomy']]) +
    '<div class="opts" style="margin-top:.6rem">' + check('cvd', P.cvd, 'Colour-blind friendly colours', 'Answers in teal and watch-outs in orange, instead of green and red') + '</div></section>';
  h += '<section class="set"><h2 class="label">Feel</h2><div class="opts">' +
    check('motion', P.motion, 'Animations', reduce ? 'Off because Reduce Motion is on in your iPhone settings' : 'Working writes itself line by line, titles get highlighted') +
    check('haptics', P.haptics, 'Haptics', 'Little taps you feel in the iPhone app') +
    (bridge ? '' : check('marks', P.marks, 'Show where haptics happen', 'This preview can’t vibrate, so it shows a small label instead')) + '</div></section>';
  h += '<section class="set"><h2 class="label">Updates</h2><div class="info"><p>New notes are added every night, around 22:00</p><p>In the app, pull down to check now</p><p class="small" style="font-size:.95rem">Notes up to ' + esc(D.upto) + '</p></div></section>';
  return h;
}

/* ---------- after render ---------- */
function after(r){
  if (r.v === 'lesson') setupLesson();
  if (r.v === 'sheet') tex($screen);
}
function dock(){
  var items = [['notes','Notes','M4 4h12a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3z M8 8h7 M8 12h7 M8 16h4'],
    ['homework','Homework','M16 3l5 5-11 11H5v-5z M13 6l5 5'],
    ['cheats','Cheat sheets','M6 3h12a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z M8 8h3 M8 12h8 M8 16h6 M14 6.5h3v3h-3z'],
    ['prefs','Settings','M12 9a3 3 0 1 0 0 6a3 3 0 1 0 0-6z M12 2v3 M12 19v3 M2 12h3 M19 12h3 M4.9 4.9l2.1 2.1 M17 17l2.1 2.1 M4.9 19.1L7 17 M17 7l2.1-2.1']];
  document.getElementById('dock').innerHTML = items.map(function(x){
    return '<button data-tab="' + x[0] + '"' + (tab === x[0] ? ' aria-current="page"' : '') + '><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="' + x[2] + '"/></svg><span class="lab">' + x[1] + '</span></button>';
  }).join('');
}

/* ---------- taps ---------- */
document.addEventListener('click', function(e){
  var t = e.target.closest('button, a'); if (!t) return;
  var d = t.dataset;
  if (d.tab) { haptic('tab'); go('#' + d.tab); return; }
  if (d.go) { e.preventDefault(); haptic('open'); go(d.go); return; }
  if (d.filter) { haptic('switch'); filter = d.filter; render(); return; }
  if (d.expand) { expanded[d.expand] = true; render(); return; }
  if (d.part) { haptic('switch'); var r = parse(location.hash); location.replace('#' + (d.part === 'hw' ? 'hw-' : 'lesson-') + r.id); return; }
  if (d.jump) { var el = document.getElementById(d.jump); if (el) el.scrollIntoView({ behavior: motionOn() ? 'smooth' : 'auto' }); return; }
  if (t.classList.contains('show-w')) { var open = t.getAttribute('aria-expanded') !== 'true'; haptic('open'); setWorking(t, open, true); updateShowAll(); return; }
  if (d.showall) {
    var btns = Array.prototype.slice.call(document.querySelectorAll('.show-w'));
    var allOpen = btns.every(function(b){ return b.getAttribute('aria-expanded') === 'true'; });
    haptic('open'); btns.forEach(function(b){ setWorking(b, !allOpen, false); }); updateShowAll(); return;
  }
  if (d.sec) { var p = d.sec.split(':'); openSec[p[0]] = openSec[p[0]] || {}; var was = !!openSec[p[0]][p[1]]; openSec[p[0]] = {}; openSec[p[0]][p[1]] = !was; haptic('switch'); render(); return; }
  if (d.allsec) { var sh = D.sheets.filter(function(x){ return x.sub === d.allsec; })[0]; var o = openSec[d.allsec] || {}; var all = sh.sections.every(function(x){ return o[x.n]; });
    openSec[d.allsec] = {}; if (!all) sh.sections.forEach(function(x){ openSec[d.allsec][x.n] = true; }); haptic('switch'); render(); return; }
  if (d.pref) { P[d.pref] = d.val; save(); apply(); haptic('switch'); render(); return; }
});
document.addEventListener('change', function(e){
  var t = e.target; if (!t.name) return;
  if (t.type === 'radio') P[t.name] = t.value; else P[t.name] = t.checked;
  save(); apply(); haptic('switch'); render();
});
window.addEventListener('hashchange', render);
window.addEventListener('resize', function(){ fit($screen); });
render();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ fit($screen); });
})();
</script>
</body></html>
